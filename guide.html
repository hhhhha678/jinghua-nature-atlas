<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/icon-leaf.svg" type="image/svg+xml" />
    <title>观赏攻略 · 京华自然</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/guide-map.css" />
  </head>
  <body class="atlas-body">
    <header class="overview-header">
      <a class="brand" href="index.html" aria-label="京华自然首页">
        <span class="brand-mark">京</span>
        <span class="brand-name">京华自然</span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="categories.html?group=1">花木</a>
        <a href="categories.html?group=2">湿地</a>
        <a href="categories.html?group=3">鸟类</a>
        <a href="categories.html?group=4">古树</a>
        <a href="categories.html?group=5">山地</a>
        <a class="is-active" href="guide.html">观赏攻略</a>
      </nav>
      <span class="edition">BEIJING NATURAL ATLAS / VIEWING MAP</span>
    </header>

    <main class="atlas-page">
      <section class="atlas-intro">
        <div>
          <span class="overview-kicker">北京自然图鉴 · 观赏地图</span>
          <h1>在城里，<br />寻找四季的自然入口</h1>
        </div>
        <p>春看花信穿过宫墙，夏听雨燕掠过城楼；<br />秋随色叶走向西山，冬在水岸等一阵远客。</p>
      </section>

      <section class="atlas-workspace" aria-label="北京自然观赏地图">
        <div class="atlas-legend" aria-label="主题类别筛选">
          <span class="atlas-legend-title">图例</span>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="all" aria-pressed="true">
            <span class="atlas-legend-all">全部</span>
          </button>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="flower" aria-pressed="true">
            <svg aria-hidden="true"><use href="#atlas-icon-flower"></use></svg>
            <span>花木</span>
          </button>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="wetland" aria-pressed="true">
            <svg aria-hidden="true"><use href="#atlas-icon-wetland"></use></svg>
            <span>湿地</span>
          </button>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="bird" aria-pressed="true">
            <svg aria-hidden="true"><use href="#atlas-icon-bird"></use></svg>
            <span>鸟类</span>
          </button>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="tree" aria-pressed="true">
            <svg aria-hidden="true"><use href="#atlas-icon-tree"></use></svg>
            <span>古树</span>
          </button>
          <button class="atlas-legend-item is-active" type="button" data-atlas-filter="mountain" aria-pressed="true">
            <svg aria-hidden="true"><use href="#atlas-icon-mountain"></use></svg>
            <span>山地</span>
          </button>
        </div>

        <div class="atlas-map-column">
          <div class="atlas-map-frame">
            <svg class="atlas-map-art" viewBox="0 0 1000 840" role="img" aria-label="北京市行政区与自然观赏地点分布图">
              <defs>
                <linearGradient id="atlasPaper" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#f8f5ec" />
                  <stop offset="0.52" stop-color="#eef2e5" />
                  <stop offset="1" stop-color="#e8eee4" />
                </linearGradient>
                <linearGradient id="atlasMountain" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#b8c8aa" stop-opacity="0.26" />
                  <stop offset="1" stop-color="#809b86" stop-opacity="0.08" />
                </linearGradient>
                <linearGradient id="atlasRiver" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#79a7b2" stop-opacity="0.2" />
                  <stop offset="1" stop-color="#c4d7d4" stop-opacity="0.08" />
                </linearGradient>
                <filter id="atlasRough">
                  <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="8" result="noise" />
                  <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
                </filter>
                <symbol id="atlas-icon-flower" viewBox="0 0 24 24">
                  <circle cx="12" cy="8" r="3"></circle>
                  <circle cx="8" cy="12" r="3"></circle>
                  <circle cx="16" cy="12" r="3"></circle>
                  <circle cx="12" cy="16" r="3"></circle>
                  <circle cx="12" cy="12" r="2"></circle>
                  <path d="M12 17v4"></path>
                </symbol>
                <symbol id="atlas-icon-wetland" viewBox="0 0 24 24">
                  <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"></path>
                  <path d="M2 12c.6.5 1.2 1 2.5 1C7 13 7 11 9.5 11c2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"></path>
                  <path d="M2 18c.6.5 1.2 1 2.5 1C7 19 7 17 9.5 17c2.6 0 2.4 2 5 2 1.3 0 1.9-.5 2.5-1"></path>
                </symbol>
                <symbol id="atlas-icon-bird" viewBox="0 0 24 24">
                  <path d="M16 7h.01"></path>
                  <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"></path>
                  <path d="m20 7 2 .5-2 .5"></path>
                  <path d="M10 18v3"></path>
                  <path d="M14 17.75V21"></path>
                  <path d="M7 18a6 6 0 0 0 3.84-10.61"></path>
                </symbol>
                <symbol id="atlas-icon-tree" viewBox="0 0 24 24">
                  <path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"></path>
                  <path d="M12 22v-3"></path>
                </symbol>
                <symbol id="atlas-icon-mountain" viewBox="0 0 24 24">
                  <path d="m8 3 4 8 5-5 5 15H2L8 3z"></path>
                </symbol>
              </defs>

              <g class="atlas-districts" id="atlasDistricts"></g>
              <g class="atlas-district-labels" id="atlasDistrictLabels"></g>
              <text class="atlas-coordinate" x="58" y="806">BEIJING / 39°54′N · 116°24′E</text>
            </svg>

            <div class="atlas-markers" id="atlasMarkers" aria-busy="true"></div>

            <div class="atlas-compass" aria-hidden="true">
              <span>N</span>
              <i></i>
            </div>
          </div>
        </div>

        <aside class="atlas-detail" id="atlasDetail" aria-live="polite">
          <div class="atlas-detail-top">
            <span class="atlas-detail-index" id="atlasDetailIndex">01</span>
            <span class="atlas-detail-category" id="atlasDetailCategory">
              <svg aria-hidden="true"><use href="#atlas-icon-flower"></use></svg>
              <span>花木</span>
            </span>
          </div>
          <h2 id="atlasDetailTitle">早春玉兰</h2>
          <p class="atlas-detail-lead" id="atlasDetailLead"></p>
          <dl class="atlas-detail-meta">
            <div><dt>观赏主题</dt><dd id="atlasDetailTheme"></dd></div>
            <div><dt>最佳时间</dt><dd id="atlasDetailTime"></dd></div>
            <div><dt>适合季节</dt><dd id="atlasDetailSeason"></dd></div>
            <div><dt>推荐时长</dt><dd id="atlasDetailDuration"></dd></div>
            <div><dt>所在区</dt><dd id="atlasDetailDistrict"></dd></div>
            <div><dt>观察重点</dt><dd id="atlasDetailFocus"></dd></div>
            <div><dt>具体位置</dt><dd id="atlasDetailLocation"></dd></div>
            <div><dt>观赏建议</dt><dd id="atlasDetailAdvice"></dd></div>
          </dl>
          <p class="atlas-detail-quote" id="atlasDetailQuote"></p>
        </aside>
        <p class="atlas-map-note">观赏时请保持距离，不投喂、不惊扰，并以园区现场开放信息为准。</p>
      </section>

      <footer class="overview-footer">
        <span>BEIJING / NATURE / MEMORY</span>
        <span>VIEWING MAP</span>
      </footer>
    </main>
    <script src="scripts/guide.js"></script>
  </body>
</html>
