    <main class="magnolia-page eryuelan-page">

        <span class="edition">NATURAL MEMORY / 03</span>

        <div class="sun-haze"></div>

        <div class="scene-copy">
          <span class="location">北京早春 · 二月兰</span>
          <h1>林下二月兰</h1>
          <p>蓝紫色小花铺在地面，把早春变成一片柔软的紫色雾气。</p>
          <span class="caption">Orychophragmus violaceus</span>
        </div>

        <div class="scene-caption">
          <span>BEIJING / SPRING</span>
          <span>01 — 10</span>
        </div>

        <section class="detail-drawer" id="detailDrawer" aria-hidden="true">
          <div class="drawer-inner">
            <div class="drawer-heading">
              <span>二月兰分节</span>
              <strong>林下二月兰</strong>
            </div>

              <button type="button" data-panel="form">

                <strong>花期与形态</strong>
              </button>
              <button type="button" data-panel="season">
                <span>02</span>

              </button>
              <button type="button" data-panel="ground">
                <span>03</span>
                <strong>观赏分布</strong>
              </button>
              <button type="button" data-panel="city">
                <span>04</span>
                <strong>群落特征</strong>
              </button>
            </div>
            <div class="drawer-place">北京 · 二月兰分类</div>
          </div>

        <section class="subpage-panel" id="subpagePanel" aria-hidden="true">

              <div class="subpage-info-top">

              </div>
