<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <radialGradient id="petal" cx="38%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#fffefb"/>
      <stop offset="58%" stop-color="#f7f0e9"/>
      <stop offset="100%" stop-color="#d7c7ba"/>
    </radialGradient>
    <radialGradient id="petalWarm" cx="38%" cy="25%" r="78%">
      <stop offset="0%" stop-color="#fffefa"/>
      <stop offset="64%" stop-color="#f2e5df"/>
      <stop offset="100%" stop-color="#cdb9af"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fb58d"/>
      <stop offset="100%" stop-color="#557660"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#6d7f73" flood-opacity="0.18"/>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <ellipse cx="450" cy="760" rx="240" ry="38" fill="#91a99d" opacity="0.2" filter="url(#blur)">
    <animate attributeName="rx" values="210;250;210" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.25;0.12" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#shadow)">
    <path d="M450 770 C452 635 455 534 465 392" fill="none" stroke="url(#stem)" stroke-width="26" stroke-linecap="round"/>
    <path d="M457 604 C382 565 325 505 291 421" fill="none" stroke="#6d926c" stroke-width="16" stroke-linecap="round"/>
    <path d="M456 560 C530 520 580 464 612 378" fill="none" stroke="#6d926c" stroke-width="15" stroke-linecap="round"/>

    <path d="M345 604 C280 555 222 565 186 628 C252 668 307 660 345 604Z" fill="#8fad82" opacity="0.82"/>
    <path d="M569 546 C636 509 695 521 728 581 C665 618 607 608 569 546Z" fill="#9dbf8c" opacity="0.78"/>

    <g transform="translate(450 384)">
      <ellipse cx="0" cy="90" rx="78" ry="176" fill="url(#petalWarm)" transform="rotate(0)">
        <animateTransform attributeName="transform" type="rotate" values="0;3;0" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petal)" transform="rotate(52)">
        <animateTransform attributeName="transform" type="rotate" values="52;48;52" dur="5.6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petalWarm)" transform="rotate(104)">
        <animateTransform attributeName="transform" type="rotate" values="104;108;104" dur="6.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petal)" transform="rotate(156)">
        <animateTransform attributeName="transform" type="rotate" values="156;152;156" dur="5.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petalWarm)" transform="rotate(208)">
        <animateTransform attributeName="transform" type="rotate" values="208;212;208" dur="5.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petal)" transform="rotate(260)">
        <animateTransform attributeName="transform" type="rotate" values="260;256;260" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="84" rx="78" ry="176" fill="url(#petalWarm)" transform="rotate(312)">
        <animateTransform attributeName="transform" type="rotate" values="312;316;312" dur="5.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="0" cy="0" r="54" fill="#e3b984"/>
      <circle cx="0" cy="0" r="28" fill="#c58b54"/>
      <circle cx="-11" cy="-10" r="10" fill="#fff0bd" opacity="0.82"/>
    </g>
  </g>

  <g fill="#fffaf0" opacity="0.8">
    <circle cx="242" cy="276" r="4">
      <animate attributeName="cy" values="276;252;276" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="685" cy="286" r="3">
      <animate attributeName="cy" values="286;266;286" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.72;0.18" dur="5.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
