    <main class="magnolia-page">

          <img class="stage-image stage-background" src="material/shouye/01-yulan-line.jpeg" alt="" />
          <img class="stage-image stage-line" src="material/shouye/01-yulan-line.jpeg" alt="" />

        <div class="sun-haze"></div>

          <span class="scene-kicker">京华自然志 · 图鉴</span>
          <span class="location">北京早春 · 玉兰</span>
          <h1>玉兰</h1>
          <p>白色花冠，像一段安静而明亮的春风。</p>
          <span class="caption">Magnolia denudata</span>
        </div>

        <div class="scene-caption">
          <span>BEIJING / SPRING</span>
          <span>01 — 10</span>

        <section class="detail-drawer" id="detailDrawer" aria-hidden="true">
          <div class="drawer-inner">
            <div class="drawer-heading">
              <span>玉兰分节</span>

                <strong>花期与形态</strong>
              </button>
              <button type="button" data-panel="season">
                <span>02</span>
                <strong>栽植环境</strong>
              </button>
              <button type="button" data-panel="garden">
                <span>03</span>
                <strong>城市分布</strong>
              </button>
              <button type="button" data-panel="culture">
                <span>04</span>
                <strong>物种特征</strong>
              </button>
            </div>
            <div class="drawer-place">北京 · 玉兰分类</div>
          </div>

        <section class="subpage-panel" id="subpagePanel" aria-hidden="true">
          <div class="subpage-stage" id="subpageStage">
            <div class="subpage-images" id="subpageImages" aria-hidden="true"></div>

              <input id="subpageScrubber" type="range" min="0" max="100" value="0" />

              <div class="subpage-info-top">
                <span class="subpage-info-index" id="subpageInfoIndex">01</span>
